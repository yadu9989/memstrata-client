name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require tag to match package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("src/memstrata_client/_version.py").read_text()
          version = re.search(r'^__version__ = "([^"]+)"$', text, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version v{version}")
          PY
      - run: pip install "build==1.6.1" "twine==7.0.0"
      - run: pip install -e ".[dev,mcp,keyring]"
      - run: pytest
      - run: python tools/check_public_boundary.py
      - run: python packaging/validate.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify clean wheel install
        run: |
          python -m venv /tmp/memstrata-release
          /tmp/memstrata-release/bin/pip install dist/*.whl
          /tmp/memstrata-release/bin/memstrata-client --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
