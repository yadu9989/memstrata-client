name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools examples packaging/validate.py
      - run: python tools/check_public_boundary.py
      - run: python packaging/validate.py
      - run: pytest

  framework-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,mcp,keyring,langchain,langgraph,crewai,autogen,ag2,llamaindex]"
      - run: python -m pip check
      - name: Require actual frameworks rather than skipped optional tests
        run: python -c "from importlib.metadata import version; print({name:version(name) for name in ['mcp','langchain-core','langgraph','crewai','autogen-core','ag2','llama-index-core']})"
      - run: python -m pytest tests/test_framework_adapters.py tests/test_cl1_public.py tests/test_cl1_mcp_contracts.py
      - run: python tools/check_public_boundary.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python packaging/validate.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          forbidden = ("memory_layer_pro", "/harness/", "memstrata_gep", "/eval/", "/sandbox/")
          bad = [name for name in names if any(token in name for token in forbidden)]
          if bad:
              raise SystemExit(f"proprietary paths in wheel: {bad}")
          print(f"wheel boundary: PASS ({len(names)} entries)")
          PY
      - run: python -m venv clean && clean/bin/pip install dist/*.whl
      - run: clean/bin/python examples/quickstart.py
