name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools examples
      - run: python tools/check_public_boundary.py
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          forbidden = ("memory_layer_pro", "/harness/", "memstrata_gep", "/eval/", "/sandbox/")
          bad = [name for name in names if any(token in name for token in forbidden)]
          if bad:
              raise SystemExit(f"proprietary paths in wheel: {bad}")
          print(f"wheel boundary: PASS ({len(names)} entries)")
          PY
      - run: python -m venv clean && clean/bin/pip install dist/*.whl
      - run: clean/bin/python examples/quickstart.py
