[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memstrata-client"
version = "0.1.1"
description = "Open client and protocol validator for MemStrata runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MemStrata" }]
keywords = ["ai-agents", "memory", "evidence", "audit", "context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "twine>=5",
]

[project.scripts]
memstrata-client = "memstrata_client.cli:main"

[project.urls]
Homepage = "https://github.com/yadu9989/memstrata-client"
Documentation = "https://github.com/yadu9989/memstrata-client#readme"
Issues = "https://github.com/yadu9989/memstrata-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/memstrata_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
